global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: aicorp-control01
    static_configs:
      - targets:
          - host.docker.internal:9100
        labels:
          host: aicorp-control01
          environment: aicorp

  - job_name: aicorp-agent
    static_configs:
      - targets:
          - agent:8081
        labels:
          service: aicorp-agent
          environment: aicorp

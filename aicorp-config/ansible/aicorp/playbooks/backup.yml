---
- name: Install AICorp durable backup procedure
  hosts: aicorp-control01
  become: true

  vars:
    aicorp_backup_mount: /mnt/backup
    aicorp_backup_root: /mnt/backup/aicorp
    aicorp_backup_retention: 7

  tasks:
    - name: Install AICorp backup script
      ansible.builtin.template:
        src: ../templates/aicorp-backup.sh.j2
        dest: /usr/local/sbin/aicorp-backup
        owner: root
        group: root
        mode: "0750"
